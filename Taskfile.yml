# Every workflow of the repository lives here; `task --list` shows them.
# Commands call real executables only (pnpm, node, cargo, git), never Unix
# utilities, so each task runs the same on Windows, Linux and FreeBSD.
# docs/engineering/repository.md describes the tasks.
version: "3"

# A pipeline fails when any of its commands fails, such as `cargo metadata` in
# `cargo metadata | node scripts/...`.
set: [pipefail]

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the pinned tooling (run once after cloning) - the pnpm packages, cargo-deny and tauri-driver
    cmds:
      - pnpm install --frozen-lockfile
      - cargo install --locked cargo-deny@0.20.2
      - cargo install --locked tauri-driver@2.1.0

  # Generated code (docs/engineering/repository.md, generated artifacts)

  gen:
    desc: Generate the IPC bindings, compile the message catalogs and write SvelteKit's types
    cmds:
      # The generator also writes the bindings of the validation commands, so
      # it needs the validation feature (apps/desktop/src-tauri/Cargo.toml).
      - cargo run --locked --quiet -p mannie-desktop --features validation --bin mannie-desktop-bindings -- apps/desktop/src/lib/generated
      - pnpm --dir apps/desktop exec paraglide-js compile --project ./project.inlang
      - pnpm --dir apps/desktop exec svelte-kit sync

  gen:pseudo-locale:
    desc: Generate the pseudo-locale catalog that the end-to-end tests use (ADR-0019)
    cmds:
      - node scripts/pseudo-locale.mjs

  # Running and building

  dev:
    desc: Run the desktop app in development mode
    cmds:
      - task: gen
      - pnpm --dir apps/desktop exec tauri dev

  build:
    desc: Build the desktop app's installers and the worker in release mode
    cmds:
      - task: gen
      - pnpm --dir apps/desktop exec tauri build
      - cargo build --locked --release -p mannie-worker

  # Formatting and sorting

  fmt:
    desc: Format and sort all code and documentation (ESLint fixes, Prettier, Tombi, rustfmt)
    cmds:
      # ESLint sorts imports, type members and Svelte attributes, then Prettier
      # lays out the result. Problems ESLint cannot fix are left to `task lint`.
      - cmd: pnpm exec eslint --fix .
        ignore_error: true
      - pnpm exec prettier --write --log-level warn .
      - pnpm exec tombi format --quiet
      - task: fmt:rust

  fmt:rust:
    desc: Format the Rust code with rustfmt
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check that all code and documentation is formatted and sorted
    cmds:
      - pnpm exec prettier --check --log-level warn .
      - pnpm exec tombi format --check --quiet
      - task: fmt:check:rust

  fmt:check:rust:
    desc: Check the formatting of the Rust code
    cmds:
      - cargo fmt --all --check

  # Linting

  lint:
    desc: Run the linters and the dependency and catalog checks
    cmds:
      - task: lint:ts
      - task: lint:types
      - task: lint:toml
      - task: lint:rust
      - task: lint:deps
      - task: lint:messages

  lint:ts:
    desc: Lint TypeScript, Svelte and JavaScript with ESLint, including the order of imports, types and attributes
    cmds:
      - pnpm exec eslint --max-warnings 0 .

  lint:types:
    desc: Type-check the desktop app and its unit tests (svelte-check), and the end-to-end tests (tsc)
    cmds:
      - pnpm --dir apps/desktop exec svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - pnpm exec tsc --project tests/e2e/tsconfig.json

  lint:toml:
    desc: Lint the TOML files against their schemas with Tombi
    cmds:
      - pnpm exec tombi lint --error-on-warnings --quiet

  lint:rust:
    desc: Check that every crate inherits the workspace lints, then run Clippy with warnings denied
    cmds:
      - cargo metadata --format-version 1 --no-deps | node scripts/check-workspace-lints.mjs
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  lint:deps:
    desc: Check the dependencies' advisories, licenses, bans and sources (cargo-deny), the worker's graph (V5) and the desktop app's npm licenses
    cmds:
      - cargo deny --locked check
      - cargo metadata --format-version 1 --locked | node scripts/check-worker-dependencies.mjs
      - pnpm licenses list --json --filter mannie-desktop | node scripts/check-licenses.mjs

  lint:messages:
    desc: Check the message catalogs for missing, empty and inconsistent messages
    cmds:
      - pnpm --dir apps/desktop exec inlang check --project ./project.inlang

  # Tests

  test:
    desc: Run the unit and integration tests
    cmds:
      - task: test:rust
      - task: test:desktop
      - task: test:scripts

  test:rust:
    desc: Run the Rust tests
    cmds:
      # tauri-build leaves a stub msvcrt.lib in the desktop crate's build
      # output for the static C runtime, and Cargo hands that folder to the
      # doctests of every crate built in the same run, which then fail to link
      # on Windows. The desktop crate's tests therefore run on their own.
      - cargo test --workspace --all-features --locked --exclude mannie-desktop
      - cargo test -p mannie-desktop --all-features --locked

  test:desktop:
    desc: Run the desktop app's unit tests with Vitest
    cmds:
      - pnpm --dir apps/desktop exec vitest run

  bench:
    desc: Run the store's benchmarks, the writer's throughput and the snapshot of a conversation with 10,000 parts
    cmds:
      - cargo bench --locked -p mannie-store --features validation

  # Providers (docs/features/chat/providers.md, conformance; V8)

  provider:live:
    desc: Run the live conformance tests against the server that the MANNIE_LIVE_* variables name
    cmds:
      - cargo test --locked -p mannie-provider --features testing --test live -- --ignored --nocapture

  tools:eval:
    desc: Run the system tools' evaluations with the model that the MANNIE_EVAL_* variables name, or with MANNIE_EVAL_MODEL=oracle to check the harness without one
    cmds:
      - cargo test --locked -p mannie-runtime --features testing --test evals -- --ignored --nocapture

  provider:record:
    desc: Record the fixtures of the server that the MANNIE_LIVE_* variables name, as the live tests run
    env:
      MANNIE_RECORD_FIXTURES: "1"
    cmds:
      - task: provider:live

  test:scripts:
    desc: Run the tests of the repository scripts, such as the local ESLint rules
    cmds:
      - node --test "tests/scripts/**/*.test.mjs"

  test:linux:
    desc: Run Clippy and the Rust tests on Linux in Docker, without the desktop crate, with the repository mounted read-only and the build output in a volume
    # The owner's workstation runs Windows; the Linux halves of the tools and
    # the process supervisor need Linux (owner decision of 2026-10-14). The
    # desktop crate needs WebKitGTK, which CI provides.
    vars:
      LINUX_RUN: docker run --rm -v "{{.ROOT_DIR}}:/src:ro" -v mannie-linux-target:/target -v mannie-linux-cargo:/usr/local/cargo/registry -e CARGO_TARGET_DIR=/target -w /src rust:1.99
    cmds:
      - "{{.LINUX_RUN}} cargo clippy --workspace --all-targets --all-features --locked --exclude mannie-desktop -- -D warnings"
      - "{{.LINUX_RUN}} cargo test --workspace --all-features --locked --exclude mannie-desktop"

  e2e:
    desc: Build the validation app and run the end-to-end tests (V1, V2, V3, V11) through tauri-driver
    cmds:
      - task: e2e:build
      - pnpm exec wdio run tests/e2e/wdio.conf.ts

  e2e:perf:
    desc: Build the validation app and measure the performance targets NFR-PERF-01 to 04; MANNIE_PERF_REPORT_ONLY=1 reports without enforcing
    cmds:
      - task: e2e:build
      - pnpm exec wdio run tests/e2e/wdio.perf.conf.ts

  e2e:build:
    desc: Build the validation app that the end-to-end tests drive
    internal: true
    cmds:
      - task: gen
      - task: gen:pseudo-locale
      # tauri-driver needs Microsoft Edge WebDriver in the WebView2 runtime's
      # version on Windows, and WebKitWebDriver from the distribution on Linux.
      - cmd: node scripts/edgedriver.mjs
        platforms: [windows]
      - pnpm --dir apps/desktop exec tauri build --debug --no-bundle --features validation --config src-tauri/tauri.validation.conf.json

  # Releases (docs/engineering/releasing.md)

  release:prepare:
    desc: Set the version and turn the changelog's Unreleased section into the release's section (VERSION=0.1.0)
    requires:
      vars: [VERSION]
    cmds:
      - node scripts/release.mjs prepare {{.VERSION}}
      # Records the new version of the workspace's own crates in Cargo.lock.
      - cargo update --workspace

  # Documentation

  docs:fmt:
    desc: Format the documentation and repository configuration with Prettier
    cmds:
      - pnpm exec prettier --write --log-level warn .

  docs:check:
    desc: Check formatting, Markdown rules, spelling, links and consistency of the documentation
    cmds:
      - pnpm exec prettier --check --log-level warn .
      - pnpm exec markdownlint-cli2
      - pnpm exec cspell lint --no-progress --no-summary "**/*.md"
      # The vendored agent skill keeps its authors' links (ADR-0006).
      - pnpm exec remark . --ignore-path .gitignore --ignore-pattern ".claude/skills/**" --ignore-pattern ".agents/skills/**" --frail --quiet --no-stdout
      - node scripts/check-docs.mjs

  ci:
    desc: Run every check a change must pass (after `task setup`)
    cmds:
      - task: gen
      - task: docs:check
      - task: fmt:check
      - task: lint
      - task: test
