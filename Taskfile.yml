# Every workflow of the repository lives here; `task --list` shows them.
# Commands call real executables only (pnpm, node, cargo, git), never Unix
# utilities, so each task runs the same on Windows, Linux and FreeBSD.
# docs/engineering/repository.md describes the tasks.
version: "3"

# A pipeline fails when any of its commands fails, such as `cargo metadata` in
# `cargo metadata | node scripts/...`.
set: [pipefail]

vars:
  # Prettier walks every folder it is given and only then drops what
  # .gitignore and .prettierignore name, so its walk skips the build output
  # and the agents' worktrees, which hold hundreds of thousands of files
  # (ADR-0037).
  PRETTIER_PATHS: '. "!target/**" "!.claude/worktrees/**"'

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the pinned tooling and fetch the crates of every Cargo workspace (run once after cloning) - the pnpm packages, cargo-deny, cargo-nextest, tauri-driver and the crates that the committed locks pin - then generate
    cmds:
      - pnpm install --frozen-lockfile
      - cargo install --locked cargo-deny@0.20.2
      - cargo install --locked cargo-nextest@0.9.148
      - cargo install --locked tauri-driver@2.1.0
      # The crates of the root, of each plugin and of each fixture plugin, the
      # one step that needs the network for them: `task gen` resolves offline
      # after it (ADR-0035, decisions 5 and 13).
      - node scripts/plugins/each.mjs -- cargo fetch --locked --manifest-path {manifest}
      - task: gen

  # Generated code (docs/engineering/repository.md, generated artifacts)

  gen:
    desc: Generate the launcher and its lock, the IPC bindings of the core and of each plugin, the message catalogs and SvelteKit's types
    cmds:
      # The plugins' manifests, the launcher in .generated/desktop/ with its
      # lock, and the editor workspace (ADR-0035, decisions 3 to 5 and 12).
      - node scripts/plugins/generate.mjs
      # The core's bindings. The program also writes the bindings of the
      # validation commands, so it needs the validation feature
      # (apps/desktop/core/Cargo.toml).
      - cargo run --locked --quiet -p mannie-desktop-core --features validation --bin mannie-desktop-bindings -- apps/desktop/src/lib/generated
      # Each plugin's bindings, and the interfaces whose commands and channels
      # the desktop binary's build script grants (ADR-0034, decisions 8 and 9).
      - cargo run --locked --quiet --manifest-path .generated/desktop/Cargo.toml -p mannie-plugin-bindings
      # The core's catalogs and each plugin's compile into one catalog for each
      # locale, from the inlang project that the generator wrote (ADR-0035,
      # decision 8), once their keys keep to their prefixes.
      - node scripts/plugins/check-messages.mjs
      - pnpm --dir apps/desktop exec paraglide-js compile --project ./.generated/project.inlang
      - pnpm --dir apps/desktop exec svelte-kit sync
      # Last: the boundaries between the core and the plugins, then the
      # fingerprint without which the desktop binary does not build
      # (ADR-0035, decisions 3 and 6).
      - node scripts/plugins/generate.mjs --seal

  gen:pseudo-locale:
    desc: Generate the pseudo-locale catalog that the end-to-end tests use (ADR-0019)
    cmds:
      - node scripts/pseudo-locale.mjs

  # Running and building

  dev:
    desc: Run the desktop app in development mode
    cmds:
      - task: gen
      - pnpm --dir apps/desktop exec tauri dev

  build:
    desc: Build the desktop app's installers and the plugins' programs, such as the worker, in release mode
    cmds:
      - task: gen
      - pnpm --dir apps/desktop exec tauri build -- --locked
      # Every program of the plugins' manifests, from its plugin's workspace
      # (ADR-0035, decision 10).
      - node scripts/plugins/programs.mjs build --release

  # Formatting and sorting

  fmt:
    desc: Format and sort all code and documentation (ESLint fixes, Prettier, Tombi, buf, rustfmt)
    cmds:
      # ESLint sorts imports, type members and Svelte attributes, then Prettier
      # lays out the result. Problems ESLint cannot fix are left to `task lint`.
      - cmd: pnpm exec eslint --fix --concurrency 2 .
        ignore_error: true
      - pnpm exec prettier --write --log-level warn {{.PRETTIER_PATHS}}
      - pnpm exec tombi format --quiet
      - pnpm exec buf format --write
      - task: fmt:rust

  fmt:rust:
    desc: Format the Rust code of every Cargo workspace and of the launcher with rustfmt
    cmds:
      # `--all` also formats the path dependencies, which a plugin's workspace
      # and the launcher share with the root's; without it, cargo fmt finds no
      # target in a virtual manifest.
      - node scripts/plugins/each.mjs --launcher -- cargo fmt --all --manifest-path {manifest}

  fmt:check:
    desc: Check that all code and documentation is formatted and sorted
    cmds:
      - pnpm exec prettier --check --log-level warn {{.PRETTIER_PATHS}}
      - pnpm exec tombi format --check --quiet
      - pnpm exec buf format --diff --exit-code
      - task: fmt:check:rust

  fmt:check:rust:
    desc: Check the formatting of the Rust code of every Cargo workspace and of the launcher
    cmds:
      - node scripts/plugins/each.mjs --launcher -- cargo fmt --all --manifest-path {manifest} --check

  # Linting

  lint:
    desc: Run the linters and the dependency and catalog checks
    cmds:
      - task: lint:ts
      - task: lint:types
      - task: lint:toml
      - task: lint:proto
      - task: lint:rust
      - task: lint:deps
      - task: lint:plugins
      - task: lint:messages

  lint:ts:
    desc: Lint TypeScript, Svelte and JavaScript with ESLint, including the order of imports, types and attributes
    cmds:
      # Two threads lint in under half the time of one, for about 1 GB more
      # memory; four save little more and take almost 4 GB (ADR-0037).
      - pnpm exec eslint --max-warnings 0 --concurrency 2 .

  lint:types:
    desc: Type-check the desktop app and its unit tests (svelte-check), and the end-to-end tests (tsc)
    cmds:
      - pnpm --dir apps/desktop exec svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - pnpm exec tsc --project tests/e2e/tsconfig.json

  lint:toml:
    desc: Lint the TOML files against their schemas with Tombi
    cmds:
      - pnpm exec tombi lint --error-on-warnings --quiet

  lint:proto:
    desc: Lint the link's protobuf contracts with buf, and check that they only grew since the merge base with origin/main and the newest release that has them (ADR-0016)
    cmds:
      - pnpm exec buf lint
      - node scripts/check-link-contracts.mjs

  lint:rust:
    desc: Check that every crate inherits its workspace's lints and that every workspace repeats the root's settings, then run Clippy with warnings denied in every workspace and the launcher, and on the library crates that each plugin ships with the core's rule against direct native calls, all in target/clippy
    # Clippy builds in a target folder of its own, so that it runs beside the
    # builds in target/ (ADR-0037, decision 2).
    env:
      CARGO_TARGET_DIR: target/clippy
    cmds:
      - node scripts/check-workspace-lints.mjs
      - node scripts/plugins/each.mjs --launcher -- cargo clippy --manifest-path {manifest} --workspace --all-targets --all-features --locked -- -D warnings
      # The library crates that each plugin's entry crate ships make only the
      # direct file-write, process and socket calls that the plugin's manifest
      # grants under [native] (ADR-0035, decision 6).
      - node scripts/plugins/check-native.mjs

  lint:deps:
    desc: Check the dependencies' advisories, licenses, bans and sources in every Cargo workspace and the launcher (cargo-deny), the worker's graph (V5), the boundaries between the core and the plugins, and the desktop app's npm licenses
    cmds:
      # The advisory database once, which the checks below read offline.
      - cargo deny fetch db
      # Every run reads the root's deny.toml, in the folder where it runs. Each
      # workspace holds a part of the shipped graph and its own tests'
      # crates, so a ban's wrapper or an ignored advisory outside its part is
      # expected there.
      - node scripts/plugins/each.mjs -- cargo deny --manifest-path {manifest} --locked --offline check --allow unused-wrapper --allow advisory-not-detected
      # The launcher's graph is the one that ships in the desktop app.
      - cargo deny --manifest-path .generated/desktop/Cargo.toml --locked --offline check
      # No crate of the desktop stack reaches a headless program, such as the
      # worker, on any target (V5).
      - node scripts/plugins/programs.mjs check
      - node scripts/plugins/check-boundaries.mjs
      - pnpm licenses list --json --filter mannie-desktop | node scripts/check-licenses.mjs

  lint:plugins:
    desc: Check that the launcher, its lock, the plugin list, the inlang projects and the fingerprint are what `task gen` writes from the plugins as they are, and that the plugins' messages keep to their prefixes
    cmds:
      - node scripts/plugins/generate.mjs --check
      - node scripts/plugins/check-messages.mjs

  lint:messages:
    desc: Check the message catalogs of the core and of each plugin for keys outside their prefixes and for missing, empty, inconsistent and unused messages
    cmds:
      - node scripts/plugins/check-messages.mjs
      # The plugins' UI uses their messages, so their folders are searched too.
      - pnpm --dir apps/desktop exec inlang check --project ./.generated/project.inlang --source ./src ../../plugins ../../tests/fixtures/plugins

  # Tests

  test:
    desc: Run the unit and integration tests
    cmds:
      - task: test:rust
      - task: test:desktop
      - task: test:scripts

  test:rust:
    desc: Run the Rust tests of every Cargo workspace and of the desktop binary with cargo-nextest, then the doctests
    cmds:
      # cargo-nextest runs the tests of every binary side by side, and every
      # test runs even after one fails (.config/nextest.toml), so a single run
      # reports every failure (ADR-0037, decision 4).
      - node scripts/plugins/each.mjs -- cargo nextest run --config-file .config/nextest.toml --manifest-path {manifest} --workspace --all-features --locked
      # The desktop binary belongs to the launcher, which `task gen` writes.
      - cargo nextest run --config-file .config/nextest.toml --manifest-path apps/desktop/src-tauri/Cargo.toml -p mannie-desktop --all-features --locked
      # nextest leaves the doctests to cargo test.
      - node scripts/plugins/each.mjs -- cargo test --doc --manifest-path {manifest} --workspace --all-features --locked --no-fail-fast

  test:rust:build:
    desc: Build the Rust tests of every Cargo workspace and of the desktop binary without running them
    cmds:
      - node scripts/plugins/each.mjs -- cargo nextest run --no-run --config-file .config/nextest.toml --manifest-path {manifest} --workspace --all-features --locked
      - cargo nextest run --no-run --config-file .config/nextest.toml --manifest-path apps/desktop/src-tauri/Cargo.toml -p mannie-desktop --all-features --locked

  test:desktop:
    desc: Run the desktop app's unit tests with Vitest
    cmds:
      - pnpm --dir apps/desktop exec vitest run

  bench:
    desc: Run the store's benchmarks, the writer's throughput and the snapshot of a conversation with 10,000 parts
    cmds:
      - cargo bench --locked -p mannie-store --features validation

  # Providers (docs/features/chat/providers.md, conformance; V8)

  provider:live:
    desc: Run the live conformance tests against the server that the MANNIE_LIVE_* variables name
    cmds:
      - cargo test --locked -p mannie-provider --features testing --test live -- --ignored --nocapture

  tools:eval:
    desc: Run the system tools' evaluations with the model that the MANNIE_EVAL_* variables name, or with MANNIE_EVAL_MODEL=oracle to check the harness without one
    cmds:
      - cargo test --locked -p mannie-runtime --features testing --test evals -- --ignored --nocapture

  provider:record:
    desc: Record the fixtures of the server that the MANNIE_LIVE_* variables name, as the live tests run
    env:
      MANNIE_RECORD_FIXTURES: "1"
    cmds:
      - task: provider:live

  test:scripts:
    desc: Run the tests of the repository scripts, such as the local ESLint rules
    cmds:
      - node --test "tests/scripts/**/*.test.mjs"

  test:linux:
    desc: Run Clippy and the Rust tests of every Cargo workspace on Linux in Docker, without the desktop app's crates, with the repository mounted read-only and the build output in a volume
    # The owner's workstation runs Windows; the Linux halves of the tools and
    # the process supervisor need Linux (owner decision of 2026-10-14). The
    # desktop app's crates need WebKitGTK, which CI provides.
    vars:
      LINUX_RUN: docker run --rm -v "{{.ROOT_DIR}}:/src:ro" -v mannie-linux-target:/target -v mannie-linux-cargo:/usr/local/cargo/registry -e CARGO_TARGET_DIR=/target -w /src rust:1.99
      PLUGIN_MANIFESTS:
        sh: node scripts/plugins/each.mjs --plugins --list
    cmds:
      - "{{.LINUX_RUN}} cargo clippy --workspace --all-targets --all-features --locked --exclude mannie-desktop-core -- -D warnings"
      - "{{.LINUX_RUN}} cargo test --workspace --all-features --locked --exclude mannie-desktop-core"
      - for: { var: PLUGIN_MANIFESTS }
        cmd: "{{.LINUX_RUN}} cargo clippy --manifest-path {{.ITEM}} --workspace --all-targets --all-features --locked -- -D warnings"
      - for: { var: PLUGIN_MANIFESTS }
        cmd: "{{.LINUX_RUN}} cargo test --manifest-path {{.ITEM}} --workspace --all-features --locked"

  e2e:
    desc: Build the validation app and the programs that the tests use, such as the worker, and run the end-to-end tests (V1, V2, V3, V11) through tauri-driver
    cmds:
      - task: e2e:build
      - pnpm exec wdio run tests/e2e/wdio.conf.ts

  e2e:perf:
    desc: Build the validation app and measure the performance targets NFR-PERF-01 to 04; MANNIE_PERF_REPORT_ONLY=1 reports without enforcing
    cmds:
      - task: e2e:build
      - pnpm exec wdio run tests/e2e/wdio.perf.conf.ts

  e2e:build:
    desc: Build the validation app that the end-to-end tests drive
    internal: true
    cmds:
      - task: gen
      - task: gen:pseudo-locale
      # tauri-driver needs Microsoft Edge WebDriver in the WebView2 runtime's
      # version on Windows, and WebKitWebDriver from the distribution on Linux.
      - cmd: node scripts/edgedriver.mjs
        platforms: [windows]
      - pnpm --dir apps/desktop exec tauri build --debug --no-bundle --features validation --config src-tauri/tauri.validation.conf.json -- --locked
      # The programs that the end-to-end tests use, such as the worker that
      # the workers' tests pair the app with (tests/e2e/support/worker.ts).
      - node scripts/plugins/programs.mjs build --e2e

  # Releases (docs/engineering/releasing.md)

  release:prepare:
    desc: Set the version in every Cargo workspace and turn the changelog's Unreleased section into the release's section (VERSION=0.1.0)
    requires:
      vars: [VERSION]
    cmds:
      - node scripts/release.mjs prepare {{.VERSION}}
      # Records the new version of each workspace's own crates in its lock.
      - node scripts/plugins/each.mjs -- cargo update --workspace --offline --manifest-path {manifest}

  # Cargo locks (ADR-0035, decision 5). No other task writes a committed lock.

  deps:update:
    desc: Update the root's crates to their newest compatible versions, then bring the plugins' locks to the root's versions
    cmds:
      - cargo update
      - task: deps:align

  deps:align:
    desc: Bring every crate that a plugin's lock pins at another version than the root's, or than another plugin's, to one version
    cmds:
      - node scripts/plugins/align-locks.mjs

  plugins:lock:
    desc: Record a plugin's changed Cargo.toml in its Cargo.lock (ID=workers), with the network only for a crate that Cargo's cache lacks
    requires:
      vars: [ID]
    cmds:
      - node scripts/plugins/lock.mjs {{.ID}}

  plugins:new:
    desc: Make a new plugin in plugins/<id>/ from the fixture plugin (ID=notes), with a lock seeded from the root's
    requires:
      vars: [ID]
    cmds:
      - node scripts/plugins/new.mjs {{.ID}}

  plugins:grants:
    desc: List what each plugin may use, for the review of a plugin's change - its services, secret entries, commands, channels, programs, the crates that only it may use and its direct native calls
    cmds:
      # The commands and channels come from the interfaces that `task gen`
      # writes (ADR-0034, decision 13).
      - task: gen
      - node scripts/plugins/grants.mjs

  # Documentation

  docs:fmt:
    desc: Format the documentation and repository configuration with Prettier
    cmds:
      - pnpm exec prettier --write --log-level warn {{.PRETTIER_PATHS}}

  docs:check:
    desc: Check formatting, Markdown rules, spelling, links and consistency of the documentation
    cmds:
      - pnpm exec prettier --check --log-level warn {{.PRETTIER_PATHS}}
      - task: docs:lint

  docs:lint:
    desc: Check the Markdown rules, spelling, links and consistency of the documentation, without the formatting, which `task fmt:check` checks too
    cmds:
      - pnpm exec markdownlint-cli2
      - pnpm exec cspell lint --no-progress --no-summary "**/*.md"
      # The vendored agent skill keeps its authors' links (ADR-0006).
      - pnpm exec remark . --ignore-path .gitignore --ignore-pattern ".claude/skills/**" --ignore-pattern ".agents/skills/**" --frail --quiet --no-stdout
      - node scripts/check-docs.mjs

  ci:
    desc: Run every check a change must pass, side by side within limits that keep the machine usable, and list each step's result and time (after `task setup`)
    cmds:
      # The steps, their order and the limits are in the script (ADR-0037).
      - node scripts/ci.mjs
