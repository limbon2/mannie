[package]
name = "mannie-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Mannie desktop app's binary: Tauri's configuration, build script, capabilities and icons, and the main function that runs mannie-desktop-core with the plugins that `task gen` lists (ADR-0035)."
license.workspace = true
# The launcher that `task gen` writes, whose members are this binary and the
# generated plugin list (ADR-0035, decision 4). Before `task gen` has run,
# cargo cannot read this manifest's workspace; CONTRIBUTING says so.
workspace = "../../../.generated/desktop"
publish.workspace = true

[[bin]]
name = "mannie-desktop"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# The desktop app's library, which this binary runs.
mannie-desktop-core = { workspace = true }
# The plugins in plugins/*/plugin.toml when `task gen` ran, in the manifests'
# order (ADR-0035, decisions 3 and 4).
mannie-plugin-list = { workspace = true }
# Without `dynamic-acl`: capabilities are fixed at build time and nothing adds
# one at runtime (ADR-0004). `tray-icon` adds the tray (window and tray
# feature); the other features are Tauri's defaults. `common-controls-v6`
# belongs to the binary, which tauri-build gives the Windows application
# manifest that the feature needs.
tauri = {
  workspace = true,
  default-features = false,
  features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "tray-icon",
    "wry",
    "x11",
  ]
}

[dev-dependencies]
# The test of the bundled plugins parses their manifests and builds the host's
# list from them.
mannie-plugin-sdk = { workspace = true, features = ["manifest"] }
mannie-plugins = { workspace = true }

[build-dependencies]
# Reads the plugins' interfaces that `task gen` wrote, whose commands and
# channels the build grants (ADR-0034, decision 8).
serde_json = { workspace = true }
# Compares the plugins' files with the fingerprint that `task gen` wrote
# (ADR-0035, decision 3).
sha2 = { workspace = true }
tauri-build = { workspace = true }

[features]
# The commands and the capability that the end-to-end validations use (V1, V2,
# V3). Only validation builds enable it; a release never does.
validation = ["mannie-desktop-core/validation", "mannie-plugin-list/validation"]

[lints]
workspace = true
