[package]
name = "mannie-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Mannie desktop app: the Tauri composition root of the master, its IPC commands and capabilities."
license.workspace = true
publish.workspace = true
default-run = "mannie-desktop"

[lib]
name = "mannie_desktop"
path = "src/lib.rs"

[[bin]]
name = "mannie-desktop"
path = "src/main.rs"

# Writes the TypeScript IPC bindings (`task gen`, ADR-0007). It needs the
# validation feature because it also writes the bindings of the validation
# commands.
[[bin]]
name = "mannie-desktop-bindings"
path = "src/bin/bindings.rs"
required-features = ["validation"]

[dependencies]
anyhow = { workspace = true }
mannie-logging = { workspace = true }
mannie-provider = { workspace = true }
mannie-runtime = { workspace = true }
# Provider credentials in the operating system's credential store (ADR-0010).
mannie-secrets = { workspace = true }
mannie-store = { workspace = true }
# The system tools, which the composition root registers and hands to the
# runtime.
mannie-tools = { workspace = true }
mannie-types = { workspace = true }
# The system's folder dialog. The core opens it, so the webview gets no access
# to the file system (ADR-0004).
rfd = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
# Without `dynamic-acl`: capabilities are fixed at build time and nothing adds
# one at runtime (ADR-0004). `tray-icon` adds the tray (window and tray
# feature); the other features are Tauri's defaults.
tauri = {
  workspace = true,
  default-features = false,
  features = [
    "common-controls-v6",
    "compression",
    "dbus",
    "tray-icon",
    "wry",
    "x11",
  ]
}
# Opens links in the system browser after the owner confirmed them (ADR-0003,
# decision 3). Only its Rust function is used: the plugin is not registered,
# so the webview has no opener command.
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
# test-util lets the channel tests run on a paused clock.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[build-dependencies]
tauri-build = { workspace = true }

[features]
# The commands and the capability that the end-to-end validations use (V1, V2,
# V3). Only validation builds enable it; a release never does.
validation = ["mannie-runtime/validation", "mannie-types/validation"]

[lints]
workspace = true
