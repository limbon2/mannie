[package]
name = "mannie-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Mannie worker: the headless service that runs on each host. In M0 it starts, logs, opens its store and installs as a service."
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
mannie-logging = { workspace = true }
mannie-store = { workspace = true }
mannie-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target."cfg(windows)".dependencies]
windows-service = { workspace = true }

[lints]
workspace = true
