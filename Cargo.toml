# Cargo workspace of the Rust core, the desktop app and the worker
# (docs/engineering/repository.md). Library crates live in crates/, and the two
# binaries in apps/. A crate is added when the first milestone that needs it
# starts, so no member is a placeholder.
#
# Every member inherits the package settings and the lint policy with:
#
#     version.workspace = true   (and the other [workspace.package] keys)
#
#     [lints]
#     workspace = true
#
# `task lint:rust` denies warnings, so "warn" fails the check like "deny";
# "warn" only keeps local builds going while code is in progress. Suppress a
# lint with `#[expect(lint, reason = "...")]` on the narrowest item.
# Tombi keeps the keys sorted, so each comment belongs to the key below it.

[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "apps/worker",
  "crates/mannie-link",
  "crates/mannie-logging",
  "crates/mannie-provider",
  "crates/mannie-runtime",
  "crates/mannie-secrets",
  "crates/mannie-store",
  "crates/mannie-tools",
  "crates/mannie-types",
]

# One version for the desktop app and the worker (ADR-0018). `task
# release:prepare` changes it.
[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Every dependency is declared once, here, and members refer to it with
# `workspace = true`. Cargo.lock pins the exact versions; specta and
# tauri-specta are release candidates and are pinned here as well (ADR-0007).
# cargo-deny (deny.toml) enforces which crate may depend on which.
[workspace.dependencies]
anyhow = "1.0.104"
# The release key that the worker embeds, and the signatures that `mannie-worker
# update` checks, which the release workflow writes in base64.
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Glob patterns of `find_files`, as the `ignore` crate matches them.
globset = "0.4.20"
# The HTTP/2 connections of the link's client, which brings its own TLS
# stream (ADR-0016).
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# Walking folders the way `.gitignore` files say, for `find_files` and
# `search_text`.
ignore = "0.4.33"
keyring-core = "1.0.1"
# The FreeBSD process supervisor's calls that rustix cannot make for it: a
# process's start time from sysctl, which it has no binding for, and
# procctl(PROC_REAP_KILL), whose binding panics on the kernel's answer
# (ADR-0014).
libc = "0.2.190"
mannie-link = { path = "crates/mannie-link" }
mannie-logging = { path = "crates/mannie-logging" }
mannie-provider = { path = "crates/mannie-provider" }
mannie-runtime = { path = "crates/mannie-runtime" }
mannie-secrets = { path = "crates/mannie-secrets" }
mannie-store = { path = "crates/mannie-store" }
mannie-tools = { path = "crates/mannie-tools" }
mannie-types = { path = "crates/mannie-types" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The link's messages (ADR-0016).
prost = "0.14.4"
# Compiles the link's protobuf files in the build without a system protoc.
protox = "0.10.0"
regex = "1.13.1"
# Without the default TLS feature, which brings the aws-lc crypto provider that
# deny.toml bans: rustls with ring only (ADR-0008, ADR-0011).
reqwest = { version = "0.13.5", default-features = false }
# The system's folder dialog, which the core opens when the owner adds a
# project (ADR-0023). On Linux it goes through the XDG desktop portal: the GTK
# backend would run GTK on a thread of its own, beside Tauri's.
rfd = { version = "0.17.2", default-features = false, features = ["wayland", "xdg-portal"] }
# Ed25519 keys and the HMAC of pairing, from the crypto provider that rustls
# uses (ADR-0008, ADR-0016).
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Safe calls of Unix file and process functions: `openat` without following
# links, child subreapers and process file descriptors (ADR-0014).
rustix = "1.1.5"
# ring is the only crypto provider (ADR-0008); rustls's default features would
# add aws-lc.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The JSON Schemas of tool arguments, generated from their Rust types.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = "1.53.2"
# The link's TLS streams with ring, without the default aws-lc that deny.toml
# bans (ADR-0008, ADR-0016).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# Cancellation tokens for running tools (engineering standards, async).
tokio-util = "0.7.20"
# The worker's configuration file (docs/features/workers/service.md).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# gRPC for the link (ADR-0016), without TLS: the link brings its own, with
# pinned keys.
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false }
# The connector of the link's client.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7"] }
# The identity of a file on Windows: its volume serial number and file index.
winapi-util = "0.1.11"
windows-native-keyring-store = "1.1.0"
windows-service = "0.8.1"
# Job Objects and the other Windows calls of the process supervisor
# (ADR-0014).
windows-sys = "0.61.2"
# The version of Windows that `system_info` reports.
windows-version = "0.1.7"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
zeroize = "1.9.1"

[workspace.lints.clippy]
# Suppressions use #[expect], which fails once the lint no longer fires.
allow_attributes = "warn"
# Every suppression says why.
allow_attributes_without_reason = "warn"
# assert!(result.is_ok()) hides the error that a failing test should show.
assertions_on_result_states = "warn"
# Arc::clone(&value) shows that only a reference count is copied.
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
# Only main decides when the process ends.
exit = "warn"
# A From implementation that can panic should be TryFrom.
fallible_impl_from = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
# Generic hasher parameters on every map argument add noise to an application.
implicit_hasher = "allow"
infinite_loop = "warn"
# Ignoring a Result needs a handled error or a stated reason.
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
# Errors keep their source.
map_err_ignore = "warn"
mem_forget = "warn"
# Error enums document their variants and stable codes.
missing_errors_doc = "allow"
mixed_read_write_in_expression = "warn"
# One module layout: foo.rs beside foo/, never foo/mod.rs.
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
# #[must_use] goes where ignoring a value is a bug, not on every pure function.
must_use_candidate = "allow"
mutex_atomic = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
# A panic is a bug (engineering standards); tests may panic.
panic = "warn"
path_buf_push_overwrite = "warn"
pedantic = { level = "warn", priority = -1 }
# Output goes through tracing; a command-line subcommand that prints says why.
print_stderr = "warn"
print_stdout = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
# A lock guard kept alive by a match scrutinee is a deadlock waiting to happen.
significant_drop_in_scrutinee = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
# unsafe is limited to the platform modules of the process supervisor, and
# every block there explains why it is sound (engineering standards).
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unused_result_ok = "warn"
# unwrap appears only in tests; expect states the invariant that makes it safe.
unwrap_used = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rust]
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
# Public types implement Debug, so tracing can record them.
missing_debug_implementations = "warn"
# Every crate and every public item has a doc comment.
missing_docs = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
# Items that other crates cannot reach are pub(crate), so each crate's API stays small.
unreachable_pub = "warn"
# Platform modules of the process supervisor opt in with
# #![expect(unsafe_code, reason = "...")].
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
