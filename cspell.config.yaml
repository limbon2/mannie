# Spell checking for the documentation. Fix a misspelling before adding a word;
# add only real project, product and technical terms here.
version: "0.2"
language: en-US
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
  - LICENSE
  # The build output, which cspell would otherwise walk before .gitignore
  # drops it.
  - target/**
  - .claude/worktrees/**
  # The vendored shadcn-svelte agent skill (ADR-0006).
  - .claude/skills/**
  - .agents/skills/**
