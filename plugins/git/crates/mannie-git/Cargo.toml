[package]
name = "mannie-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The git plugin: tools that read and change the owner's repositories through the installed git under the core's policy, with git mentions, cards and a side panel (ADR-0038)."
license.workspace = true
publish.workspace = true

[dependencies]
# The stream of the channel follow_repository.
futures-util = { workspace = true }
mannie-plugin-sdk = { workspace = true }
# The JSON Schema of the tools' arguments.
schemars = { workspace = true }
serde = { workspace = true }
# The tools' arguments, which the model writes as JSON, and the data of
# their cards.
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
# The version of git, found once, and the lock that runs one change at a
# time in a repository.
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
# Repositories for the tests, which the installed git builds.
mannie-git-testing = { workspace = true }
# The plugin through the real host on the core's test runtime, and the
# conformance check (ADR-0034, decision 1).
mannie-plugin-harness = { workspace = true }
# The tests parse the plugin's manifest as the host does, and build the
# calls that only the core builds.
mannie-plugin-sdk = { workspace = true, features = ["manifest", "testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
