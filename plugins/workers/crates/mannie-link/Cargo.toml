[package]
name = "mannie-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The link between the master and its workers in the Workers plugin: the protobuf contracts, the documents that cross the link, mutual TLS with pinned keys and pairing (ADR-0016, ADR-0031)."
license.workspace = true
publish.workspace = true

# The JSON documents of the link against the fixtures of each version (V6).
[[test]]
name = "compatibility"

[dependencies]
futures-util = { workspace = true }
# The contracts that cross the link, such as a host's ceiling (ADR-0034,
# decision 2).
mannie-plugin-sdk = { workspace = true }
prost = { workspace = true }
# Ed25519 keys, their signatures in the handshake, the HMAC of pairing and
# the randomness of codes and nonces.
ring = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The documents that cross the link and reach the UI through the master's
# IPC types, such as a worker's details (ADR-0007).
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The refusal codes of a worker's runtime, whose fixtures the compatibility
# test reads (V6; ADR-0034, decision 1).
mannie-plugin-harness = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
protox = { workspace = true }
tonic-prost-build = { workspace = true }

[lints]
workspace = true
