[package]
name = "mannie-workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The master's side of the Workers plugin: the paired workers and their tables, pairing, the connections over the link, and the executor that gives tasks to workers (ADR-0027, ADR-0031)."
license.workspace = true
publish.workspace = true

# Pairing over loopback: codes, attempts, keys in the middle and pins (V6).
[[test]]
name = "pairing"

# Tasks given to workers through an in-process link: reports, numbers,
# follow-ups, approvals, Stop, offline workers, restarts, deletion, and
# Workers turned off and on.
[[test]]
name = "delegation"

# The master ends after the part, after the rows and after a submission whose
# answer was lost, and no case starts a second task.
[[test]]
name = "delegation_crash"

# Delegation over loopback: reports, leases, approvals, the task's
# conversation, a dropped link, an offline master and versions (V6).
[[test]]
name = "linked_delegation"

# Calls whose answers the link lost: Submit, Decide and Cancel (V6).
[[test]]
name = "link_drop"

# Every tool of the worker agent through a delegated task (M4's exit).
[[test]]
name = "delegated_conformance"

# Workers through the plugin host: its manifest, its default, on and off,
# plugin_off, and a start without a service that it declares.
[[test]]
name = "plugin"

# The plugin's tables: their migrations from 0.2.0 and their statements.
[[test]]
name = "store"

[dependencies]
# The master's key in the credential store, which 0.2.0 kept as base64.
base64 = { workspace = true }
# The jitter of the master's reconnects.
fastrand = { workspace = true }
futures-util = { workspace = true }
# The client's connections, over the link's own TLS streams.
hyper-util = { workspace = true }
mannie-link = { workspace = true }
# The plugin's definition, the services that its start receives, the
# executor point and the contracts of its tasks (ADR-0034, decisions 2, 4 and
# 5).
mannie-plugin-sdk = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The workers' IPC types, from which the desktop app generates bindings
# (ADR-0007).
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tonic = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
# The address of a profile's provider, which a task on a worker reaches.
url = { workspace = true }
# The IDs of paired workers.
uuid = { workspace = true }

[dev-dependencies]
# The worker's side of the link, whose files the pairing tests read.
mannie-link-worker = { workspace = true }
# The plugin through the real host on the core's test runtime, the
# conformance check and the parts of the core that the tests use (ADR-0034,
# decision 1).
mannie-plugin-harness = { workspace = true }
# The exported manifest, which the plugin's tests parse, and the credential
# store in memory.
mannie-plugin-sdk = { workspace = true, features = ["manifest", "testing"] }
# The plugin's test tools: a worker on loopback and the delegation harness.
mannie-workers-testing = { workspace = true }
# The digests of the files that the conformance tests compare.
ring = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[features]
# The hook through which the plugin's test tools, mannie-workers-testing,
# open a channel to a test worker. Never enabled in the desktop app or the
# worker.
testing = []

[lints]
workspace = true
