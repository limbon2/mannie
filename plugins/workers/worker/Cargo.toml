[package]
name = "mannie-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Mannie worker: the headless service that runs Mannie's agent runtime on a host for a paired master, behind the link."
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
# The signatures of release archives, which the release workflow writes in
# base64.
base64 = { workspace = true }
clap = { workspace = true }
# What the worker, a composition root of its own, uses of the core: the
# runtime, the tools, the store, logging and the provider (ADR-0034,
# decision 12).
mannie-host-kit = { workspace = true }
mannie-link = { workspace = true }
# The worker's side of the link.
mannie-link-worker = { workspace = true }
# The contracts that the worker shares with the plugin.
mannie-plugin-sdk = { workspace = true }
# The Ed25519 check of a release archive's signature.
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The private folder that `update` unpacks an archive in.
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
# The IDs of the host's command rules.
uuid = { workspace = true }

[build-dependencies]
base64 = { workspace = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
# procctl(PROC_TRACE_CTL), which turns off tracing of the worker; rustix's
# binding passes its argument wrongly.
libc = { workspace = true }

[target."cfg(unix)".dependencies]
# Core dumps and tracing turned off, whether the worker's account can write
# its configuration, and the host's name.
rustix = { workspace = true, features = ["fs", "process", "system"] }

[target."cfg(windows)".dependencies]
windows-service = { workspace = true }
# Whether the worker's account can write its configuration's folder, and the
# host's name.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[lints]
workspace = true
