[package]
name = "mannie-designer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Designer plugin: a design surface beside the conversation, with the owner's projects in its sidebar (ADR-0035)."
license.workspace = true
publish.workspace = true

[dependencies]
# The stream of the channel follow_projects.
futures-util = { workspace = true }
# The plugin's definition, its command and channel, and its table (ADR-0034).
mannie-plugin-sdk = { workspace = true }
# The plugin's command, channel and error, whose types cross IPC (ADR-0007).
serde = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
# The changes of the projects, which the channel follows.
tokio = { workspace = true, features = ["sync"] }
# The lines that the plugin's start and stop log.
tracing = { workspace = true }
# The IDs of the projects.
uuid = { workspace = true }

[dev-dependencies]
# The plugin through the real host on the core's test runtime, and the
# conformance check (ADR-0034, decision 1).
mannie-plugin-harness = { workspace = true }
# The exported manifest, which the plugin's tests parse as the host does.
mannie-plugin-sdk = { workspace = true, features = ["manifest"] }
# The inputs and outputs of the plugin's calls, as JSON.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
