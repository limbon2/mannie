[package]
name = "mannie-ssh-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An SSH server for the SSH plugin's tests, in the test's process or as a program for the end-to-end tests. Never shipped."
license.workspace = true
publish.workspace = true

[dependencies]
# The server's host keys.
rand = { workspace = true }
russh = { workspace = true }
# The program's line for the end-to-end tests.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
