[package]
name = "mannie-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The SSH plugin: hosts that the owner registers, and a tool that runs commands on them under the master's policy (ADR-0036)."
license.workspace = true
publish.workspace = true

[dependencies]
# The stream of the channel follow_hosts.
futures-util = { workspace = true }
mannie-plugin-sdk = { workspace = true }
# The SSH client (plugins/ssh/docs/adr/0001-speak-ssh-with-russh-and-pinned-host-keys.md).
russh = { workspace = true }
# The JSON Schema of run_ssh_command's arguments.
schemars = { workspace = true }
serde = { workspace = true }
# The arguments of run_ssh_command, which the model writes as JSON.
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
# The list of hosts that the channels and the section read, the sockets and
# timers of the connections, and the task that ends a command whose call was
# dropped.
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tracing = { workspace = true }
# The IDs of the hosts.
uuid = { workspace = true }

[dev-dependencies]
# The plugin through the real host on the core's test runtime, and the
# conformance check (ADR-0034, decision 1).
mannie-plugin-harness = { workspace = true }
# The tests parse the plugin's manifest as the host does, and keep the
# passwords in the SDK's credential store in memory.
mannie-plugin-sdk = { workspace = true, features = ["manifest", "testing"] }
# The SSH server that the tests connect to.
mannie-ssh-testing = { workspace = true }
# The inputs and outputs of the plugin's calls, as JSON.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
