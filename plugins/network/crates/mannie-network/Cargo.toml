[package]
name = "mannie-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Network Client plugin: Postman-style API collections with OpenAPI v2 and v3 import, custom variables, headers, parameters and cookies, redacted for agents and visible as-is to the owner (ADR-0075)."
license.workspace = true
publish.workspace = true

[dependencies]
# Basic authentication header encoding and redaction scrubbing.
base64 = { workspace = true }
# Streams for the live state channel and response body downloads.
futures-util = { workspace = true }
# The plugin SDK: tools, sections, mentions, IPC, store, secrets and file dialog.
mannie-plugin-sdk = { workspace = true }
# The HTTP client for collection requests over rustls (ring) and system proxy.
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "system-proxy"] }
# ring crypto provider for rustls-no-provider.
rustls = { workspace = true }
# Bounded YAML 1.2 event parser for OpenAPI v2 and v3 YAML import (ADR-0075).
saphyr-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 digest binding complete request bodies to one-time approvals.
sha2 = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
# Canonical URL and origin parsing, query encoding and cookie domain matching.
url = { workspace = true }
# UUIDv7 identifiers for collections, folders, requests, environments and cookies.
uuid = { workspace = true }

[dev-dependencies]
# Real plugin host on the core's test runtime, plus SDK conformance checks.
mannie-plugin-harness = { workspace = true }
# Manifest parsing and in-memory secrets/file-dialog test doubles.
mannie-plugin-sdk = { workspace = true, features = ["manifest", "testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
