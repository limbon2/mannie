[package]
name = "mannie-images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Images plugin: the images that the owner attaches to a message, prepared for the model, and the image source that gives them to the runtime (ADR-0033)."
license.workspace = true
publish.workspace = true

[dependencies]
# The thumbnails and the pasted or dropped files that cross IPC as text
# (ADR-0007).
base64 = { workspace = true }
futures-util = { workspace = true }
# Decoding, turning, shrinking and encoding images (ADR-0033, decision 10).
image = { workspace = true }
# The plugin's definition, the image point and the image contracts that the
# plugin's source implements (ADR-0034, decisions 2 and 4).
mannie-plugin-sdk = { workspace = true }
serde = { workspace = true }
# The plugin's IPC types, from which the desktop app generates bindings
# (ADR-0007).
specta = { workspace = true }
thiserror = { workspace = true }
# One decode at a time, on a blocking thread.
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
# The keys of waiting images and the IDs of chosen files.
uuid = { workspace = true }

[dev-dependencies]
# The plugin through the real host on the core's test runtime, and the
# conformance check (ADR-0034, decision 1).
mannie-plugin-harness = { workspace = true }
# The exported manifest, which the plugin's tests parse, and the file
# dialog in memory.
mannie-plugin-sdk = { workspace = true, features = ["manifest", "testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
