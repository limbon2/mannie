[package]
name = "mannie-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mannie's SQLite store: the writer thread, the reader pool, migrations and repositories. The only crate that uses rusqlite."
license.workspace = true
publish.workspace = true

[[test]]
name = "durability"
required-features = ["validation"]

[[bench]]
harness = false
name = "writer_throughput"
required-features = ["validation"]

[[bench]]
harness = false
name = "snapshot"
required-features = ["validation"]

[dependencies]
mannie-types = { workspace = true }
rusqlite = { workspace = true }
# The versioned JSON documents of the runtime's and the profiles' tables.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
# Lets the tests of plugins create a database as 0.2.0 left it, with their
# modules (ADR-0030). Never enabled in the desktop app or the worker.
testing = []
# Exposes the synthetic event table that the validations (V3) write to. Never
# enabled in the desktop app or the worker.
validation = []

[lints]
workspace = true
