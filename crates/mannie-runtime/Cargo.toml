[package]
name = "mannie-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mannie's agent runtime: runs as durable actors, the event log and its subscriptions, retries, the context budget and compaction (ADR-0012)."
license.workspace = true
publish.workspace = true

# The run actor against a fake model.
[[test]]
name = "loop"
required-features = ["testing"]

# Subscribers end with the state of a fresh snapshot (property test).
[[test]]
name = "subscriptions"
required-features = ["testing"]

# Compaction at the limits of every known model and of small local models.
[[test]]
name = "compaction"
required-features = ["testing"]

# Killing the process during a reply keeps the transcript, and Retry works.
[[test]]
name = "crash"
required-features = ["testing"]

# Tool calls between model calls: the policy, approvals, Stop, budgets and
# early stops.
[[test]]
name = "tools_loop"
required-features = ["testing"]

# Full access: a conversation and its child agents run their operations
# without asking, from the next call after the owner's switch.
[[test]]
name = "full_access"
required-features = ["testing"]

# Killing the process in every state of a tool call never repeats its
# operation.
[[test]]
name = "tool_crash"
required-features = ["testing"]

# Tasks of child agents: reports, tool sets, slots, background tasks,
# follow-ups, approvals through the parent, stopping, budgets and refusals.
[[test]]
name = "tasks"
required-features = ["testing"]

# Killing the process in every state of a task never repeats what a child
# did.
[[test]]
name = "task_crash"
required-features = ["testing"]

# A compromised model's injected operations cause nothing that the owner did
# not allow.
[[test]]
name = "injection"
required-features = ["testing"]

# A secret in Mannie's environment never reaches a command; its own binary,
# because the child it starts again carries the planted secret.
[[test]]
name = "command_environment"
required-features = ["testing"]

# Profiles and their credentials in the vault.
[[test]]
name = "profiles"
required-features = ["testing"]

# Tasks that another machine assigns: the agent that runs them, idempotent
# assignments, follow-ups, credentials that come later, cancels, slots,
# restarts and the watch.
[[test]]
name = "assigned_tasks"
required-features = ["testing"]

# A machine's ceiling through the loop: every mode, the machine's rules, its
# own folders, a task that narrows the mode, and forged choices.
[[test]]
name = "ceiling"
required-features = ["testing"]

# What plugins contribute while they are on (ADR-0030): a fake plugin's tool,
# child agent and section, calls into a plugin that stopped, and all or none.
[[test]]
name = "plugins"
required-features = ["testing"]

# Mentions (ADR-0032): the suggestions, the core's files and folders, the
# checks of a message's references, the budget that they share, and a fake
# plugin's provider.
[[test]]
name = "mentions"
required-features = ["testing"]

[[test]]
name = "images"
required-features = ["testing"]

# The tasks of a plugin's executor (ADR-0031): the tool and section of a
# registered executor, plans, refusals, reports, background tasks, waits,
# follow-ups, Stop, a stopped plugin and the reads of task conversations.
[[test]]
name = "executors"
required-features = ["testing"]

# The services that the runtime binds to a plugin (ADR-0034, decision 5): an
# executor host that answers only for the plugin's kind, and credentials lent
# only for an active task of that kind and the profile of its run.
[[test]]
name = "services"
required-features = ["testing"]

# A lent credential is logged with its task and profile and never itself; its
# own binary, because it installs a global log subscriber.
[[test]]
name = "lend_log"
required-features = ["testing"]

# Tasks that a real model completes through the tools, and injection tasks;
# ignored unless run on purpose with `task tools:eval`.
[[test]]
name = "evals"
required-features = ["testing"]

# A planted credential reaches only the Authorization header; its own binary,
# because it installs a global log subscriber.
[[test]]
name = "planted_credential"
required-features = ["testing"]

# Plugins' tools on the owner's paths: the workspace, offering, path accesses
# and the data of tool cards (ADR-0038, ADR-0039).
[[test]]
name = "plugin_paths"
required-features = ["testing"]

# Background commands through the runtime: reads, notes, Stop, task ends,
# deletion, quitting, the limit and grants in both modes (ADR-0041).
[[test]]
name = "background_commands"
required-features = ["testing"]

# Killing the process while a background command runs leaves none of it
# running after the next start.
[[test]]
name = "background_crash"
required-features = ["testing"]

# Commands that a plugin's tool starts on a remote host in the background and
# hands the core: tickets, reads, stops, ends on the host, the limit, the
# plugin going off and quitting (ADR-0041, decision 11).
[[test]]
name = "remote_background"
required-features = ["testing"]

# The service `processes`, which runs the installed git (ADR-0038).
[[test]]
name = "processes"
required-features = ["testing"]

# Plugins' tools that run installed programs: their accesses, grants, rules
# and full access (ADR-0038).
[[test]]
name = "plugin_programs"
required-features = ["testing"]

[dependencies]
# The bytes of a stored image as `read_image` returns them (ADR-0033).
base64 = { workspace = true }
# The jitter of retry delays.
fastrand = { workspace = true }
futures-util = { workspace = true }
# The plugin SDK, whose extension points the runtime consumes (ADR-0034,
# decision 6), with the host's constructors, such as a mention provider's
# context.
mannie-plugin-sdk = { workspace = true, features = ["host"] }
mannie-provider = { workspace = true }
mannie-store = { workspace = true }
# The system tools, their policy and the process supervisor (ADR-0013,
# ADR-0014).
mannie-tools = { workspace = true }
mannie-types = { workspace = true }
# The patterns that end the waits of `read_command_output`, which the tools
# compile (ADR-0041).
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The hash of the text that a checkpoint covers, and the digest of an image.
sha2 = { workspace = true }
# The temporary store of the test runtime, with the testing feature.
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
mannie-provider = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }
# test-util lets the waits of background commands run on a paused clock.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true }

[features]
# The test runtime, the in-memory vault and the fake model, for the tests of
# this crate. Never enabled in the desktop app or the worker.
testing = ["dep:tempfile", "mannie-provider/testing"]
# The seeder of long conversations for the desktop app's performance checks.
# Never enabled in a release.
validation = ["mannie-store/validation"]

[lints]
workspace = true
