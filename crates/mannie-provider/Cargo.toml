[package]
name = "mannie-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Mannie's provider adapters: one streamed model call through the OpenAI Responses API or Chat Completions, with quirk profiles (ADR-0011)."
license.workspace = true
publish.workspace = true

# The conformance tests replay recorded and constructed fixtures through the
# fixture server of the testing module (V8).
[[test]]
name = "conformance"
required-features = ["testing"]

# The transport over real HTTP: redirects, the credential, timeouts and the
# log.
[[test]]
name = "transport"
required-features = ["testing"]

# The adapters of search profiles over real HTTP: requests, answers, refusals
# and the test of a search profile (ADR-0047).
[[test]]
name = "search"
required-features = ["testing"]

# A credential that a server repeats never reaches the log; its own binary,
# because tracing caches enabled callsites for the whole process.
[[test]]
name = "log"
required-features = ["testing"]

# Live tests call real servers when MANNIE_LIVE_* variables name them; they are
# ignored unless run on purpose (`task provider:live`, `task provider:record`).
[[test]]
name = "live"
required-features = ["testing"]

# The ChatGPT sign-in over real HTTP: the token endpoint, refreshes,
# revocation, the ID token's keys and the plan's catalog (ADR-0062).
[[test]]
name = "chatgpt"
required-features = ["testing"]

# The live checks of the ChatGPT plan: the owner signs in in the browser, and
# the checks call OpenAI. Ignored unless run on purpose
# (`task provider:live:chatgpt`, `task provider:record:chatgpt`).
[[test]]
name = "live_chatgpt"
required-features = ["testing"]

[dependencies]
# The `data:` URLs of the images in a request (ADR-0033).
base64 = { workspace = true }
# The chunks of a streamed response body.
bytes = { workspace = true }
futures-util = { workspace = true }
mannie-types = { workspace = true }
# HTTP/1.1 and HTTP/2 over rustls, the operating system's trust store through
# rustls-platform-verifier, streamed bodies, and the system's proxy settings.
reqwest = { workspace = true, features = ["http2", "rustls-no-provider", "stream", "system-proxy"] }
# The ChatGPT sign-in's RS256 check of ID tokens, its PKCE challenge and its
# random values (ADR-0062). ring is already the TLS provider (ADR-0008).
ring = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# The loopback listener of the ChatGPT sign-in's return reads and answers one
# request (ADR-0062, decision 4).
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
tracing = { workspace = true }
# The host of a base URL, to tell local addresses from remote ones, and the
# forms of the ChatGPT sign-in's token requests.
url = { workspace = true }
# The host ID that the ChatGPT sign-in sends, a UUID of version 4 that OpenAI
# asks for (ADR-0062, decision 3).
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true }

[features]
# The scripted provider and the fixture server, for the tests of this crate and
# of the runtime. Never enabled in the desktop app or the worker.
testing = ["tokio/io-util", "tokio/net", "tokio/rt"]

[lints]
workspace = true
