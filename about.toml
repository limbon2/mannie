# cargo-about: the third-party notices of the Rust crates in a release
# (ADR-0017, docs/engineering/releasing.md). The release workflow runs
# `cargo about generate about.hbs` with this configuration. The accepted
# licenses are the policy's, as in deny.toml, which checks them on every change.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The targets Mannie ships for (ADR-0008).
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# Tests and benchmarks do not ship; build scripts and macros can put their
# output into the binaries, so their crates are listed.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Mannie's own crates are not third-party code.
private = { ignore = true }
