# cargo-deny: advisories, licenses, bans and sources of the Rust dependencies
# (ADR-0017 for licenses, ADR-0008 for the crate boundaries). `task lint` runs
# `cargo deny check`, and a failure blocks the merge. Every exception below
# names its reason.

[graph]
all-features = true
# The targets Mannie ships for (ADR-0008): the desktop app on Windows and Linux,
# and the worker also on Linux with musl and on FreeBSD.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
# The RustSec advisory database. Every advisory fails the check, including
# unmaintained and unsound crates; an accepted one goes into `ignore` with its
# reason and when to look at it again.
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability. specta's macros use it at compile time only; look again when specta 2.0 is released" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, with no known vulnerability. The GTK 0.18 bindings of Tauri on Linux use it at compile time only; look again when Tauri moves to newer gtk-rs" },
]

[licenses]
# The permissive licenses of ADR-0017, and MPL-2.0 for libraries used unmodified.
allow = [
  "0BSD",
  "Apache-2.0",
  # Apache-2.0 with an exception that only adds permissions.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The list is the policy of ADR-0017, so a license no dependency uses yet stays.
unused-allowed-license = "allow"

# Mannie's own crates are not published; their license is in the workspace.
[licenses.private]
ignore = true

[bans]
# Tauri and the Windows crates bring several versions of some crates, which
# cargo-deny would otherwise report on every run.
multiple-versions = "allow"
wildcards = "deny"
# Mannie's own crates refer to each other by path and are never published.
allow-wildcard-paths = true
deny = [
  # ring is the only crypto provider; rustls is used everywhere (ADR-0008).
  { crate = "aws-lc-rs", reason = "ring is the only crypto provider (ADR-0008)" },
  { crate = "aws-lc-sys", reason = "ring is the only crypto provider (ADR-0008)" },
  { crate = "openssl-sys", reason = "rustls is used everywhere (ADR-0008)" },
  # The crate boundaries of docs/engineering/repository.md.
  { crate = "tauri", wrappers = [
    "mannie-desktop",
    "tauri-plugin-opener",
    "tauri-plugin-single-instance",
    "tauri-specta",
  ], reason = "only the desktop app depends on Tauri (ADR-0008)" },
  { crate = "rusqlite", wrappers = ["mannie-store"], reason = "only the store uses SQLite (ADR-0008, ADR-0009)" },
  { crate = "keyring-core", wrappers = [
    "mannie-secrets",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
  ], reason = "credentials go through mannie-secrets (ADR-0010)" },
  { crate = "mannie-secrets", wrappers = [
    "mannie-desktop",
  ], reason = "provider credentials stay on the master; the worker never depends on the credential store (ADR-0010)" },
  { crate = "rfd", wrappers = [
    "mannie-desktop",
  ], reason = "only the desktop app opens the system's folder dialog; the worker has no window (ADR-0004)" },
  { crate = "tonic", wrappers = [
    "mannie-link",
    "mannie-workers",
    "tonic-prost",
  ], reason = "only the Workers plugin's link speaks gRPC; the master and its workers reach each other through it (ADR-0016, ADR-0031)" },
  # The plugin boundaries of ADR-0030 (decision 10): the core never depends on
  # a plugin, a plugin never depends on another plugin, and only the desktop
  # app's composition root lists the plugins.
  { crate = "mannie-link", wrappers = [
    "mannie-worker",
    "mannie-workers",
  ], reason = "the link belongs to the Workers plugin, whose crates alone use it (ADR-0030)" },
  { crate = "mannie-workers", wrappers = [
    "mannie-desktop",
  ], reason = "a plugin's crates are used only by the desktop app's composition root (ADR-0030)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
