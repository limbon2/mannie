# cargo-deny: advisories, licenses, bans and sources of the Rust dependencies
# (ADR-0017 for licenses, ADR-0008 for the crate boundaries). `task lint` runs
# `cargo deny check` in every Cargo workspace and in the launcher, whose graph
# ships in the desktop app (ADR-0035, decision 5). Every exception below names
# its reason.

[graph]
all-features = true
# The targets Mannie ships for (ADR-0008): the desktop app on Windows and Linux,
# and the worker also on Linux with musl and on FreeBSD.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

[advisories]
# The RustSec advisory database. Every advisory fails the check, including
# unmaintained and unsound crates; an accepted one goes into `ignore` with its
# reason and when to look at it again.
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no known vulnerability. specta's macros use it at compile time only; look again when specta 2.0 is released" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, with no known vulnerability. The GTK 0.18 bindings of Tauri on Linux use it at compile time only; look again when Tauri moves to newer gtk-rs" },
  # zbus 6 took these crates in, with no known vulnerability. zbus 5 talks to
  # D-Bus on Linux for the credential store and for the opener and
  # single-instance plugins, and the latest secret-service,
  # zbus-secret-service-keyring-store, tauri-plugin-opener and
  # tauri-plugin-single-instance still require zbus 5 (checked on
  # 2026-10-17). Look again when they move to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained and merged into zbus 6, with no known vulnerability; it comes through zbus 5, which the credential store and Tauri's plugins still require" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained and merged into zbus 6, with no known vulnerability; it comes through zbus 5, which the credential store and Tauri's plugins still require" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained and merged into zbus 6, with no known vulnerability; it comes through zbus 5, which the credential store and Tauri's plugins still require" },
]

[licenses]
# The permissive licenses of ADR-0017, and MPL-2.0 for libraries used unmodified.
allow = [
  "0BSD",
  "Apache-2.0",
  # Apache-2.0 with an exception that only adds permissions.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The list is the policy of ADR-0017, so a license no dependency uses yet stays.
unused-allowed-license = "allow"

# Mannie's own crates are not published; their license is in the workspace.
[licenses.private]
ignore = true

[bans]
# Tauri and the Windows crates bring several versions of some crates, which
# cargo-deny would otherwise report on every run.
multiple-versions = "allow"
wildcards = "deny"
# Mannie's own crates refer to each other by path and are never published.
allow-wildcard-paths = true
deny = [
  # ring is the only crypto provider; rustls is used everywhere (ADR-0008).
  { crate = "aws-lc-rs", reason = "ring is the only crypto provider (ADR-0008)" },
  { crate = "aws-lc-sys", reason = "ring is the only crypto provider (ADR-0008)" },
  { crate = "openssl-sys", reason = "rustls is used everywhere (ADR-0008)" },
  # The crate boundaries of docs/engineering/repository.md.
  { crate = "tauri", wrappers = [
    "mannie-desktop",
    "mannie-desktop-core",
    "tauri-plugin-opener",
    "tauri-plugin-single-instance",
    "tauri-specta",
  ], reason = "only the desktop app's binary and library depend on Tauri (ADR-0008, ADR-0035)" },
  { crate = "rusqlite", wrappers = ["mannie-store"], reason = "only the store uses SQLite (ADR-0008, ADR-0009)" },
  { crate = "keyring-core", wrappers = [
    "mannie-secrets",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
  ], reason = "credentials go through mannie-secrets (ADR-0010)" },
  { crate = "mannie-secrets", wrappers = [
    "mannie-desktop-core",
  ], reason = "provider credentials stay on the master; the worker never depends on the credential store (ADR-0010)" },
  { crate = "rfd", wrappers = [
    "mannie-desktop-core",
  ], reason = "only the desktop app opens the system's folder and file dialogs; the worker has no window (ADR-0004)" },
  # A plugin's crates live in the plugin's own Cargo workspace, and the crates
  # that only one plugin may use are listed in its plugin.toml, which
  # scripts/plugins/check-boundaries.mjs checks, so this file names no
  # plugin's crate (ADR-0035, decision 6).
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
