# Saves a GitHub Actions cache entry and verifies that it persisted, retrying
# after backoff when concurrent sccache writes transiently hit GitHub's
# 200-entries/minute cache API rate limit. actions/cache/save exits 0 with a
# warning on 429, so without verification downstream jobs would miss the key.
name: Save and verify cache
description: Saves a cache entry with actions/cache/save and retries if rate-limited.

inputs:
  path:
    description: Paths to save in the cache.
    required: true
  key:
    description: Exact cache key to save and verify.
    required: true

runs:
  using: composite
  steps:
    - name: Save cache (attempt 1)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - name: Verify cache (attempt 1)
      id: verify1
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        lookup-only: true

    - name: Wait for cache rate-limit window before retry 1
      if: steps.verify1.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Cache save did not persist (likely GitHub cache API rate limit); waiting 35 s before retrying..."
        sleep 35

    - name: Save cache (attempt 2)
      if: steps.verify1.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - name: Verify cache (attempt 2)
      id: verify2
      if: steps.verify1.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        lookup-only: true

    - name: Wait for cache rate-limit window before retry 2
      if: steps.verify1.outputs.cache-hit != 'true' && steps.verify2.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "Cache save still did not persist; waiting 65 s for rate-limit reset before final retry..."
        sleep 65

    - name: Save cache (attempt 3)
      if: steps.verify1.outputs.cache-hit != 'true' && steps.verify2.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}

    - name: Verify cache (attempt 3)
      id: verify3
      if: steps.verify1.outputs.cache-hit != 'true' && steps.verify2.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        lookup-only: true

    - name: Fail if cache entry did not persist
      if: steps.verify1.outputs.cache-hit != 'true' && steps.verify2.outputs.cache-hit != 'true' && steps.verify3.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "::error::Failed to persist cache entry ${{ inputs.key }} after 3 attempts."
        exit 1
