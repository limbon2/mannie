# Every night and for every release tag: on FreeBSD, in a virtual machine
# with the oldest supported 14.x release (ADR-0008), the tests of the core's
# crates that run inside a worker, among them the system tools with the
# process supervisor (V4), the provider adapters and the runtime, and for
# each program of the plugins' manifests with a FreeBSD target, such as the
# worker, its workspace's tests and its smoke test, such as the worker's rc.d
# service with a delegated command. Pull requests only cross-build the
# programs for FreeBSD (ci.yml). Actions are pinned by commit SHA.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  freebsd:
    name: Programs on FreeBSD 14.4
    # GitHub's Linux runners have the KVM that the virtual machine needs, so
    # this job stays on them (docs/engineering/ci-runners.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # The programs with a FreeBSD target, from the plugins' manifests,
      # become plain cargo commands, so the virtual machine needs no Node and
      # no generated file (ADR-0035, decision 10). The packages go before the
      # machine copies the repository.
      - name: Write the commands of the programs
        run: |
          pnpm install --frozen-lockfile --filter mannie
          node scripts/plugins/programs.mjs freebsd > freebsd-programs.sh
          rm -rf node_modules
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          copyback: false
          prepare: |
            retry() {
              attempt=1
              until "$@"; do
                if [ "$attempt" -ge 4 ]; then
                  return 1
                fi
                sleep $((attempt * 5))
                attempt=$((attempt + 1))
              done
            }
            retry pkg install -y curl git
            retry sh -c "curl --proto '=https' --tlsv1.2 -sSf --retry 3 --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none"
          run: |
            set -eu
            . "$HOME/.cargo/env"
            # The workflow's environment does not reach the virtual machine,
            # whose disk lives on the runner's, so CI, network retries and the
            # setting that keeps the build folder small are set here.
            export CI=true
            export CARGO_INCREMENTAL=0
            export CARGO_NET_RETRY=5
            export RUSTUP_MAX_RETRIES=5
            rustup toolchain install
            # Build and run the worker-side core crates in one unified pass,
            # then run the timing-sensitive tests serially as .config/nextest.toml does.
            cargo test --locked \
              -p mannie-store -p mannie-logging -p mannie-types -p mannie-tools \
              -p mannie-provider -p mannie-runtime \
              --features mannie-provider/testing,mannie-runtime/testing \
              -- \
              --skip stopping_the_parent_ends_every_child_within_a_second \
              --skip stop_ends_a_running_command_and_its_reply_within_a_second \
              --skip a_conversation_wakes_at_most_six_times_an_hour \
              --skip a_slow_subscriber_falls_behind_and_catches_up_from_its_cursor \
              --skip _ends_with_the_command
            cargo test --locked \
              -p mannie-store -p mannie-logging -p mannie-types -p mannie-tools \
              -p mannie-provider -p mannie-runtime \
              --features mannie-provider/testing,mannie-runtime/testing \
              -- --test-threads=1 \
              stopping_the_parent_ends_every_child_within_a_second \
              stop_ends_a_running_command_and_its_reply_within_a_second \
              a_conversation_wakes_at_most_six_times_an_hour \
              a_slow_subscriber_falls_behind_and_catches_up_from_its_cursor \
              _ends_with_the_command
            # Each program's workspace's tests, the program, its smoke
            # test's helpers and its smoke test.
            sh freebsd-programs.sh
