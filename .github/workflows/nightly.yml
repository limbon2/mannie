# Every night and for every release tag: the worker's tests and its rc.d
# service on FreeBSD, in a virtual machine with the oldest supported 14.x
# release (ADR-0008). Pull requests only cross-build the worker for FreeBSD
# (ci.yml). Actions are pinned by commit SHA.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  freebsd:
    name: Worker on FreeBSD 14.4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          copyback: false
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          run: |
            set -eu
            . "$HOME/.cargo/env"
            rustup toolchain install
            # The crates of the worker; the desktop app does not run on FreeBSD.
            cargo test --locked -p mannie-worker -p mannie-store -p mannie-logging -p mannie-types
            cargo build --locked -p mannie-worker
            sh scripts/ci/worker-service-unix.sh target/debug/mannie-worker
