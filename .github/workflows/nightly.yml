# Every night and for every release tag: the tests of the worker and of the
# crates it runs agents with, among them the system tools with the process
# supervisor (V4), the provider adapters, the runtime and the link, and the
# worker's rc.d service with a delegated command, on FreeBSD, in a virtual
# machine with the oldest supported 14.x release (ADR-0008). Pull requests
# only cross-build the worker for FreeBSD (ci.yml). Actions are pinned by
# commit SHA.
name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  freebsd:
    name: Worker on FreeBSD 14.4
    # GitHub's Linux runners have the KVM that the virtual machine needs, so
    # this job stays on them (docs/engineering/ci-runners.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          copyback: false
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          run: |
            set -eu
            . "$HOME/.cargo/env"
            # The workflow's environment does not reach the virtual machine,
            # whose disk lives on the runner's, so the build settings of
            # ci.yml that keep the build small are set here.
            export CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=line-tables-only
            rustup toolchain install
            # The crates of the worker: the system tools that its agents use,
            # the provider adapters, the runtime and the link (ADR-0015); the
            # desktop app does not run on FreeBSD.
            cargo test --locked -p mannie-worker -p mannie-store -p mannie-logging -p mannie-types -p mannie-tools
            cargo test --locked -p mannie-provider -p mannie-runtime -p mannie-link --features mannie-provider/testing,mannie-runtime/testing,mannie-link/testing
            cargo build --locked -p mannie-worker
            cargo build --locked -p mannie-link --features testing --example smoke-master
            sh scripts/ci/worker-service-unix.sh target/debug/mannie-worker target/debug/examples/smoke-master
