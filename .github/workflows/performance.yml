# Nightly and manual performance measurements (NFR-PERF-01 to 09). Shared
# hosted runners measure their neighbours as much as Mannie, so this workflow
# records the figures in the job log and summary without enforcing targets or
# blocking pull requests and releases (docs/engineering/ci-runners.md).
# Actions are pinned by commit SHA.
name: Performance

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to measure
        type: choice
        options: [both, linux, windows]
        default: both

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build validation app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-2025","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for prebuilt end-to-end binaries
        id: e2e-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}
          lookup-only: true
      - uses: ./.github/actions/setup
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        with:
          compiler-cache: read
      - name: Build the validation app and end-to-end helpers
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: task e2e:build
      - name: Stage end-to-end binaries
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: node scripts/plugins/programs.mjs stage-e2e target/e2e-bundle
      - name: Cache staged end-to-end binaries
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-cache-verified
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}

  measure:
    name: Performance measurements (${{ matrix.os }})
    needs: build
    env:
      CARGO_TARGET_DIR: target/e2e-bundle
      MANNIE_E2E_PREBUILT: "1"
      MANNIE_E2E_SHOW_WINDOW: "1"
      MANNIE_PERF_REPORT_ONLY: "1"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-2025","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore staged end-to-end binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: tauri-driver@2.1.0
      - name: Install the test runner packages
        run: pnpm install --frozen-lockfile --filter mannie
      - name: Install Linux runtime libraries and GNOME Keyring
        if: runner.os == 'Linux'
        run: |
          sudo sh scripts/ci/install-ubuntu-packages.sh \
            libwebkit2gtk-4.1-0 librsvg2-2 libayatana-appindicator3-1 libxdo3 \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - name: Measure the performance targets on WebView2
        if: runner.os == 'Windows'
        run: pwsh -File scripts/ci/run-windows-e2e.ps1 -Mode performance
      - name: Measure the performance targets on WebKitGTK
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring xvfb-run --auto-servernum pnpm exec wdio run tests/e2e/wdio.perf.conf.ts
      - name: Record the performance measurements
        if: always()
        run: node scripts/ci/summarize-performance.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-failures-${{ matrix.os }}
          path: target/e2e-failures
          if-no-files-found: ignore
          retention-days: 3
