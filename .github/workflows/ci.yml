# The checks of every pull request and every push to main (engineering
# standards, Definition of Done): `task ci` and the end-to-end tests on Windows
# and Linux, with the performance figures they measure (NFR-PERF-01 to 04,
# enforced only on the reference machine), the credential store with GNOME
# Keyring, KWallet and no Secret Service (V7), and the programs of the
# plugins' manifests, such as the worker: their smoke tests on Windows and
# Linux and their builds for FreeBSD and static Linux (ADR-0035, decision
# 10). The release workflow runs it too. Every job uses a standard GitHub-hosted
# runner, which is free in this public repository (docs/engineering/ci-runners.md).
# Actions are pinned by commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        description: Full CI, one Rust test, or desktop end-to-end tests
        type: choice
        options: [full, rust, e2e]
        default: full
      platform:
        description: Platform for a focused run; full CI always uses both
        type: choice
        options: [both, linux, windows]
        default: both
      cargo-arguments:
        description: For Rust, Cargo arguments as a JSON array with --locked, a package and an exact test or filter
        type: string
        default: ""
      e2e-spec:
        description: For end-to-end tests, one repository-relative .test.ts file; empty runs the suite
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'full' }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # With full debug information the workspace's test build outgrew the disk
  # of the Linux runners, and the linker crashed. Line tables keep the file
  # and line of a panic.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    if: inputs.scope != 'e2e'
    name: ${{ inputs.scope == 'rust' && 'Selected Rust test' || 'task ci' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'rust' && inputs.platform == 'windows' && '["windows-2025"]' || inputs.scope == 'rust' && inputs.platform == 'linux' && '["ubuntu-24.04"]' || '["windows-2025","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The whole history and the tags: `task lint:proto` compares the link's
      # contracts with the merge base and the newest release that has them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: check
      - name: Run the full checks
        if: inputs.scope != 'rust'
        run: task ci
      - name: Run the selected Rust test
        if: inputs.scope == 'rust'
        env:
          MANNIE_CARGO_ARGUMENTS: ${{ inputs.cargo-arguments }}
        run: node scripts/ci/run-cargo-test.mjs
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  e2e:
    if: inputs.scope != 'rust'
    name: End-to-end tests (${{ matrix.os }})
    # These are disposable desktops. Let the webview paint normally rather
    # than using the off-screen mode that keeps local tests out of the way.
    env:
      MANNIE_E2E_SHOW_WINDOW: "1"
      MANNIE_E2E_SPEC: ${{ inputs.scope == 'e2e' && inputs.e2e-spec || '' }}
    strategy:
      fail-fast: false
      matrix:
        # V1 names the WebKitGTK 4.1 of Ubuntu 22.04, the oldest supported LTS.
        os: ${{ fromJSON(inputs.scope == 'e2e' && inputs.platform == 'windows' && '["windows-2025"]' || inputs.scope == 'e2e' && inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-2025","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: e2e
      - name: Build the validation app
        run: task e2e:build
      - name: Run the end-to-end tests on WebView2
        if: runner.os == 'Windows'
        run: pwsh -File scripts/ci/run-windows-e2e.ps1
      # WebKitGTK needs a display, the single-instance plugin a session bus,
      # and provider profiles a Secret Service for their credentials.
      - name: Install GNOME Keyring
        if: runner.os == 'Linux'
        run: sudo sh scripts/ci/install-ubuntu-packages.sh gnome-keyring
      - name: Run the end-to-end tests on WebKitGTK
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring xvfb-run --auto-servernum task e2e:run
      # Shared runners measure their neighbours as much as Mannie, so CI
      # records the figures without enforcing the targets.
      - name: Measure the performance targets on WebView2
        if: runner.os == 'Windows' && env.MANNIE_E2E_SPEC == ''
        env:
          MANNIE_PERF_REPORT_ONLY: "1"
        run: pwsh -File scripts/ci/run-windows-e2e.ps1 -Mode performance
      - name: Measure the performance targets on WebKitGTK
        if: runner.os == 'Linux' && env.MANNIE_E2E_SPEC == ''
        env:
          MANNIE_PERF_REPORT_ONLY: "1"
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring xvfb-run --auto-servernum pnpm exec wdio run tests/e2e/wdio.perf.conf.ts
      - name: Record the performance measurements
        if: always() && env.MANNIE_E2E_SPEC == ''
        run: node scripts/ci/summarize-performance.mjs
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  credentials:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: Credential store (${{ matrix.secret-service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        secret-service: [gnome-keyring, kwallet, none]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-key: credentials
      - name: Install the Secret Service
        if: matrix.secret-service != 'none'
        run: |
          sudo sh scripts/ci/install-ubuntu-packages.sh ${{ matrix.secret-service == 'kwallet' && 'libkf5wallet-bin libqca-qt5-2-plugins' || 'gnome-keyring' }}
      - name: Build the tests
        run: cargo test --locked -p mannie-secrets --no-run
      - name: Store, read, replace and delete a credential
        if: matrix.secret-service != 'none'
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh ${{ matrix.secret-service }} cargo test --locked -p mannie-secrets -- --ignored --exact the_secret_service_stores_reads_replaces_and_deletes
      - name: Keep a planted secret out of logs, databases and crash files
        if: matrix.secret-service != 'none'
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh ${{ matrix.secret-service }} cargo test --locked -p mannie-secrets --test planted_secret
      # A session bus without service directories cannot start a Secret
      # Service, whatever the runner has installed.
      - name: Refuse to store a credential without a Secret Service
        if: matrix.secret-service == 'none'
        run: dbus-run-session --config-file=scripts/ci/session-without-services.conf -- cargo test --locked -p mannie-secrets -- --ignored --exact without_a_secret_service_no_credential_is_stored

  # The programs of the plugins' manifests and what CI does with each, so
  # that a plugin with a program changes no workflow (ADR-0035, decision 10).
  plan:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: Plan the programs' jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # The manifests' TOML parser is a development dependency of the root.
      - run: pnpm install --frozen-lockfile --filter mannie
      - id: plan
        run: node scripts/plugins/programs.mjs matrix >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test of ${{ matrix.package }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.smoke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: smoke
      # The program as it ships, then what the smoke test needs beside it,
      # such as Workers' test master, in builds of their own, so that the
      # helpers' features never reach the program.
      - name: Build the program
        run: cargo build --locked --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }}
      - name: Build the smoke test's helpers
        if: matrix.helpers != ''
        run: cargo build --locked --manifest-path ${{ matrix.folder }}/Cargo.toml ${{ matrix.helpers }}
      - name: Run the smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./${{ matrix.script }} target/debug
      - name: Run the smoke test as root
        if: runner.os == 'Linux'
        run: sudo sh ${{ matrix.script }} target/debug

  program-builds:
    name: Build of ${{ matrix.package }} for ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: program-builds-${{ matrix.target }}
      - name: Install musl-tools for a static Linux build
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo sh scripts/ci/install-ubuntu-packages.sh musl-tools
      - name: Build with cargo
        if: matrix.tool == 'cargo'
        run: cargo build --locked --release --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }} --target ${{ matrix.target }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.tool == 'cross'
        with:
          tool: cross@0.2.5
      # The FreeBSD tests run every night (nightly.yml), and for pull requests
      # that change what the programs run (freebsd.yml).
      - name: Cross-build
        if: matrix.tool == 'cross'
        run: cross build --locked --release --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }} --target ${{ matrix.target }}
      # The plugin's crates build for a cross target without warnings. Clippy
      # links nothing, so it needs the target's standard library but not
      # cross.
      - name: Lint the plugin's crates for the target
        if: matrix.tool == 'cross'
        run: cargo clippy --locked --manifest-path ${{ matrix.folder }}/Cargo.toml --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

  # The core's crates that run inside a worker on FreeBSD, with the
  # FreeBSD halves of the tools and the process supervisor (ADR-0014).
  core-freebsd:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: The core's crates for FreeBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml and the target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: core-freebsd
      - name: Lint the core's crates for FreeBSD
        run: cargo clippy --locked -p mannie-tools -p mannie-runtime --all-targets --all-features --target x86_64-unknown-freebsd -- -D warnings
