# The checks of every pull request and every push to main (engineering
# standards, Definition of Done): the groups of `task ci` and the end-to-end
# tests on Windows and Linux (built once per platform and executed across
# lightweight balanced shards), the credential store with GNOME Keyring,
# KWallet and no Secret Service (V7), and the programs of the plugins'
# manifests, such as the worker: their smoke tests on Windows and Linux and
# their builds for FreeBSD and static Linux (ADR-0035, decision 10). Report-only
# performance measurements run on their own schedule in performance.yml, and
# full upstream advisory checks run daily in dependency-audit.yml as well as on
# dependency changes and releases. The release workflow takes the result of the
# run that the push of its commit started, and runs these jobs itself when the
# commit has none. Every job uses a standard GitHub-hosted runner, which is
# free in this public repository (docs/engineering/ci-runners.md). Actions are
# pinned by commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      scope:
        description: Full CI, one Rust test, or desktop end-to-end tests
        type: choice
        options: [full, rust, e2e]
        default: full
      platform:
        description: Platform for a focused run; full CI always uses both
        type: choice
        options: [both, linux, windows]
        default: both
      cargo-arguments:
        description: For Rust, Cargo arguments as a JSON array with --locked, a package and an exact test or filter
        type: string
        default: ""
      e2e-spec:
        description: For end-to-end tests, one repository-relative .test.ts file; empty runs the suite
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'full' }}-${{ inputs.platform || 'both' }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

# The compiler cache's keys hold every variable whose name starts with CARGO_,
# so the workflows that share the cache set the same ones (release.yml). The
# debug information of dev builds, which once filled the disk of the Linux
# runners, is set in .cargo/config.toml for every build.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The checks of `task ci`, one job for each group of its steps
  # (scripts/ci.mjs), so the slowest group sets the time of the checks, a
  # problem that needs no build shows within minutes, and a failed job names
  # the command that repeats it. Linux builds about twice as fast as Windows,
  # so its groups share jobs. A test of the script compares this list with
  # the script's groups.
  checks:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: task ci -- ${{ matrix.groups }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, groups: static }
          - { os: windows-2025, groups: desktop }
          - { os: windows-2025, groups: clippy }
          - { os: windows-2025, groups: core }
          - { os: windows-2025, groups: plugins }
          - { os: ubuntu-24.04, groups: static }
          - { os: ubuntu-24.04, groups: desktop clippy }
          - { os: ubuntu-24.04, groups: core plugins }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # The whole history and the tags: `task lint:proto`, in the static
      # group, compares the link's contracts with the merge base and the
      # newest release that has them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The static group builds nothing. It saves the registry's cache for
      # the other jobs, and the job with Clippy saves Clippy's build folder.
      - uses: ./.github/actions/setup
        with:
          rust-cache: ${{ contains(matrix.groups, 'clippy') && 'clippy' || 'registry' }}
          save-rust-cache: ${{ matrix.groups == 'static' || contains(matrix.groups, 'clippy') }}
          compiler-cache: ${{ matrix.groups == 'static' && 'none' || 'write' }}
          system-libraries: ${{ matrix.groups != 'static' }}
      # Unrelated feature changes should not break on newly filed upstream
      # unmaintained/yanked notices; vulnerabilities, licenses, bans and
      # sources stay enforced on every run, and dependency changes, daily
      # audits and releases run the full strict check.
      - name: Check whether Cargo dependencies changed
        if: matrix.groups == 'static' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
            range="$base...HEAD"
          else
            base="$PUSH_BEFORE"
            range="$base..HEAD"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000) exit 0 ;;
          esac
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$range" | grep -Eq '(^|/)Cargo\.(toml|lock)$|^deny\.toml$'; then
              echo "MANNIE_DENY_ALLOW_ADVISORY_CHURN=1" >> "$GITHUB_ENV"
            fi
          fi
      - name: Run the checks of the groups
        run: task ci -- ${{ matrix.groups }}
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  # A repair's selected Rust test (docs/engineering/ci-runners.md, running
  # the pipeline). GitHub adds the platform to the name of a job that runs,
  # and a full run lists this job as skipped under the name alone.
  rust-test:
    if: inputs.scope == 'rust'
    name: Selected Rust test
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-2025"]' || inputs.platform == 'linux' && '["ubuntu-24.04"]' || '["windows-2025","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Run the selected Rust test
        env:
          MANNIE_CARGO_ARGUMENTS: ${{ inputs.cargo-arguments }}
        run: node scripts/ci/run-cargo-test.mjs
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  # Builds the validation app, E2E plugin programs and plugin test-server
  # examples once per platform and stores the staged binaries in GitHub's
  # cache so the E2E shards and performance workflow reuse them without
  # installing Rust or compiling again.
  e2e-build:
    if: inputs.scope != 'rust'
    name: Build end-to-end app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # V1 names the WebKitGTK 4.1 of Ubuntu 22.04, the oldest supported LTS.
        os: ${{ fromJSON(inputs.scope == 'e2e' && inputs.platform == 'windows' && '["windows-2025"]' || inputs.scope == 'e2e' && inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-2025","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for prebuilt end-to-end binaries
        id: e2e-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}
          lookup-only: true
      - uses: ./.github/actions/setup
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        with:
          compiler-cache: write
      - name: Build the validation app and end-to-end helpers
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: task e2e:build
      - name: Stage end-to-end binaries
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        run: node scripts/plugins/programs.mjs stage-e2e target/e2e-bundle
      - name: Cache staged end-to-end binaries
        if: steps.e2e-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  # The end-to-end specs in two balanced parts, running the binaries staged
  # by e2e-build without Rust or compiler caches (tests/e2e/support/shard.ts).
  # A repair's one spec runs in one job.
  e2e:
    needs: e2e-build
    if: inputs.scope != 'rust'
    name: End-to-end tests ${{ matrix.shard }} (${{ matrix.os }})
    # These are disposable desktops. Let the webview paint normally rather
    # than using the off-screen mode that keeps local tests out of the way.
    env:
      CARGO_TARGET_DIR: target/e2e-bundle
      MANNIE_E2E_PREBUILT: "1"
      MANNIE_E2E_SHOW_WINDOW: "1"
      MANNIE_E2E_SPEC: ${{ inputs.scope == 'e2e' && inputs.e2e-spec || '' }}
      MANNIE_E2E_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # V1 names the WebKitGTK 4.1 of Ubuntu 22.04, the oldest supported LTS.
        os: ${{ fromJSON(inputs.scope == 'e2e' && inputs.platform == 'windows' && '["windows-2025"]' || inputs.scope == 'e2e' && inputs.platform == 'linux' && '["ubuntu-22.04"]' || '["windows-2025","ubuntu-22.04"]') }}
        shard: ${{ fromJSON(inputs.scope == 'e2e' && inputs.e2e-spec != '' && '["1/1"]' || '["1/2","2/2"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore staged end-to-end binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/e2e-bundle
            target/edgedriver
          key: e2e-bin-v1-${{ matrix.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.40.1
          repo-token: ${{ github.token }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: tauri-driver@2.1.0
      - name: Install the test runner packages
        run: pnpm install --frozen-lockfile --filter mannie
      # Runtime libraries only: the binary was already compiled by e2e-build.
      - name: Install Linux runtime libraries and GNOME Keyring
        if: runner.os == 'Linux'
        run: |
          sudo sh scripts/ci/install-ubuntu-packages.sh \
            libwebkit2gtk-4.1-0 librsvg2-2 libayatana-appindicator3-1 libxdo3 \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - name: Run the end-to-end tests on WebView2
        if: runner.os == 'Windows'
        run: pwsh -File scripts/ci/run-windows-e2e.ps1
      # WebKitGTK needs a display, the single-instance plugin a session bus,
      # and provider profiles a Secret Service for their credentials.
      - name: Run the end-to-end tests on WebKitGTK
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring xvfb-run --auto-servernum task e2e:run
      - name: Upload end-to-end failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.os }}-${{ strategy.job-index }}
          path: target/e2e-failures
          if-no-files-found: ignore
          retention-days: 3

  # Builds mannie-secrets tests once and verifies GNOME Keyring, KWallet and
  # a session bus without any Secret Service (V7) in separate D-Bus sessions.
  credentials:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: Credential store (gnome-keyring, kwallet, none)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          compiler-cache: write
          system-libraries: false
      - name: Install Secret Service backends and D-Bus
        run: sudo sh scripts/ci/install-ubuntu-packages.sh dbus-x11 gnome-keyring libkf5wallet-bin libqca-qt5-2-plugins
      - name: Build the tests
        run: cargo test --locked -p mannie-secrets --no-run
      - name: "GNOME Keyring: store, read, replace and delete a credential"
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring cargo test --locked -p mannie-secrets -- --ignored --exact the_secret_service_stores_reads_replaces_and_deletes
      - name: "GNOME Keyring: keep a planted secret out of logs, databases and crash files"
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh gnome-keyring cargo test --locked -p mannie-secrets --test planted_secret
      - name: "KWallet: store, read, replace and delete a credential"
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh kwallet cargo test --locked -p mannie-secrets -- --ignored --exact the_secret_service_stores_reads_replaces_and_deletes
      - name: "KWallet: keep a planted secret out of logs, databases and crash files"
        run: dbus-run-session -- sh scripts/ci/with-secret-service.sh kwallet cargo test --locked -p mannie-secrets --test planted_secret
      # A session bus without service directories cannot start a Secret
      # Service, whatever the runner has installed.
      - name: Refuse to store a credential without a Secret Service
        run: dbus-run-session --config-file=scripts/ci/session-without-services.conf -- cargo test --locked -p mannie-secrets -- --ignored --exact without_a_secret_service_no_credential_is_stored
      - name: Report compiler cache use
        if: always() && env.SCCACHE_PATH != ''
        run: sccache --show-stats

  # The programs of the plugins' manifests and what CI does with each, so
  # that a plugin with a program changes no workflow (ADR-0035, decision 10).
  plan:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: Plan the programs' jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      smoke: ${{ steps.plan.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      # The manifests' TOML parser is a development dependency of the root.
      - run: pnpm install --frozen-lockfile --filter mannie
      - id: plan
        run: node scripts/plugins/programs.mjs matrix >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test of ${{ matrix.package }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.smoke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.smoke) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      # Only a run on main saves the build cache: one that a tag or a pull
      # request saves serves that tag or pull request alone.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The program as it ships, then what the smoke test needs beside it,
      # such as Workers' test master, in builds of their own, so that the
      # helpers' features never reach the program.
      - name: Build the program
        run: cargo build --locked --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }}
      - name: Build the smoke test's helpers
        if: matrix.helpers != ''
        run: cargo build --locked --manifest-path ${{ matrix.folder }}/Cargo.toml ${{ matrix.helpers }}
      - name: Run the smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./${{ matrix.script }} target/debug
      - name: Run the smoke test as root
        if: runner.os == 'Linux'
        run: sudo sh ${{ matrix.script }} target/debug

  program-builds:
    name: Build of ${{ matrix.package }} for ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml and the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: program-builds-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install musl-tools for a static Linux build
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo sh scripts/ci/install-ubuntu-packages.sh musl-tools
      - name: Build with cargo
        if: matrix.tool == 'cargo'
        run: cargo build --locked --release --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }} --target ${{ matrix.target }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.tool == 'cross'
        with:
          tool: cross@0.2.5
      # The FreeBSD tests run every night (nightly.yml), and for pull requests
      # that change what the programs run (freebsd.yml).
      - name: Cross-build
        if: matrix.tool == 'cross'
        run: cross build --locked --release --manifest-path ${{ matrix.folder }}/Cargo.toml -p ${{ matrix.package }} --target ${{ matrix.target }}
      # The plugin's crates build for a cross target without warnings. Clippy
      # links nothing, so it needs the target's standard library but not
      # cross.
      - name: Lint the plugin's crates for the target
        if: matrix.tool == 'cross'
        run: cargo clippy --locked --manifest-path ${{ matrix.folder }}/Cargo.toml --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings

  # The core's crates that run inside a worker on FreeBSD, with the
  # FreeBSD halves of the tools and the process supervisor (ADR-0014).
  core-freebsd:
    if: inputs.scope != 'rust' && inputs.scope != 'e2e'
    name: The core's crates for FreeBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml and the target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: core-freebsd
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the core's crates for FreeBSD
        run: cargo clippy --locked -p mannie-tools -p mannie-runtime --all-targets --all-features --target x86_64-unknown-freebsd -- -D warnings
